# Ручний запуск працівника з живою моделлю (шлях 2B, експеримент). Розкладу НЕМАЄ свідомо:
# безкоштовний ліміт OpenRouter (50 запитів на добу) спільний з усім акаунтом, а щоденний запуск його б з'їв.
#
# Секрет репозиторію: OPENROUTER_API_KEY (Settings → Secrets and variables → Actions). Значення ключа в репо не потрапляє.
# Запуск: Actions → «Працівник (ручний запуск)» → Run workflow → оберіть набір.
name: Працівник (ручний запуск)

on:
  workflow_dispatch:
    inputs:
      set:
        description: "Набір даних"
        type: choice
        options: [clean, problems, injection]
        default: problems

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Працівник
        env:
          WORKER_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node src/worker.ts --set "${{ inputs.set }}"
      # Звіт — артефакт запуску, а не коміт: людина читає й вирішує.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: review-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
