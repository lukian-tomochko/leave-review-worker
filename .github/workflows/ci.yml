# Офлайн-перевірки працівника: типи й тести. Модель тут НЕ викликається і ключів не потрібно.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Без --omit=optional: SDK запускає бінарник Claude Code з optional-залежності для платформи.
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run dry-run -- --set problems
